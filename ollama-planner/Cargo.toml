[package]
name = "ollama-planner"
version = "0.1.0"
edition = "2021"

[lib]
name = "ollama_planner"
path = "src/lib.rs"

[dependencies]
ubu_core = { path = "../core", package = "core" }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
