[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quick-ubu"
path = "src/main.rs"

[dependencies]
ubu_core = { path = "../core", package = "core" }
ollama-planner = { path = "../ollama-planner" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
